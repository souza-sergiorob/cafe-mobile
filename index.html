<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6f4e37">
  <title>Café Mobile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <h1>☕ Café Mobile</h1>
  </header>

  <main>
    <!-- ===== Tela 1: Cardápio ===== -->
    <section id="tela-cardapio" class="tela">
      <div class="filtros">
        <button class="filtro ativo" data-categoria="Todos">Todos</button>
        <button class="filtro" data-categoria="Cafés">Cafés</button>
        <button class="filtro" data-categoria="Geladas">Geladas</button>
        <button class="filtro" data-categoria="Salgados">Salgados</button>
        <button class="filtro" data-categoria="Doces">Doces</button>
      </div>
      <div id="lista-produtos" class="lista-produtos"></div>
    </section>

    <!-- ===== Tela 2: Pedido (começa escondida com "hidden") ===== -->
    <section id="tela-pedido" class="tela" hidden>
      <h2>Seu pedido</h2>
      <ul id="lista-pedido" class="lista-pedido"></ul>
      <div class="total">
        <span>Total</span>
        <strong id="total-pedido">R$ 0,00</strong>
      </div>
      <button id="btn-finalizar" class="btn-principal">Finalizar pedido</button>
    </section>
  </main>

  <!-- ===== Barra de abas, fixa embaixo, como nos apps ===== -->
  <nav class="abas">
    <button class="aba ativa" data-tela="tela-cardapio">☕<span>Cardápio</span></button>
    <button class="aba" data-tela="tela-pedido">🧾<span>Pedido</span>
      <span id="contador-pedido" class="contador" hidden>0</span>
    </button>
  </nav>

  <!-- Mensagem rápida que aparece e some (toast) -->
  <div id="aviso" class="aviso" role="status"></div>

  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
